name: Countdown

description: >-
  Example YAML module: a countdown the teacher starts for everyone in the room.
  Late joiners see the running countdown, because its end time is in the room state.

show-in:
  - '*'

icon: mdi-timer-outline

load:
  scripts:
    - https://edrys-labs.github.io/module/edrys.js
  links:
    - https://edrys-labs.github.io/module/vendor/water.min.css
    - https://edrys-labs.github.io/module/vendor/open-iconic/css/open-iconic.min.css
    # the classroom's light or dark theme, fonts, toolbar/pill/footer; after water.css
    - https://edrys-labs.github.io/module/edrys-module.css

# A string, not a YAML map: the settings form only reads a string here
module-config: |
  teacherConfig:
    minutes:
      type: number
      default: 5
      hint: Length of the countdown in minutes

style: |
  /* author `display` rules would otherwise override the hidden attribute */
  [hidden] { display: none !important; }
  /* replaced once Edrys is ready; appears only after 0.5s, so fast loads don't flicker */
  .loading { opacity: 0; animation: show-loading 0s 0.5s forwards; }
  @keyframes show-loading { to { opacity: 1; } }
  /* toolbar, content, footer; no title, the frame shows the module's name */
  html, body { height: 100%; }
  body { margin: 0; padding: 0; max-width: none; display: flex; flex-direction: column; }
  main { flex: 1; min-height: 0; overflow: auto; padding: 16px 18px; text-align: center; }
  #time { font: 600 3em var(--edrys-mono); color: var(--edrys-heading); margin: 8px 0; }
  #time.over { color: var(--edrys-error); }
  .muted, .loading { color: var(--edrys-muted); }

body: |
  <header class="edrys-toolbar">
    <span id="status" class="edrys-pill" role="status">Loading&hellip;</span>
  </header>
  <main>
    <p id="time" class="loading" aria-live="polite">Loading&hellip;</p>
    <p id="hint" class="muted"></p>
  </main>
  <footer class="edrys-footer" id="controls" hidden>
    <button id="start" class="primary"><span class="oi" data-glyph="media-play" aria-hidden="true"></span> Start</button>
    <button id="reset"><span class="oi" data-glyph="media-stop" aria-hidden="true"></span> Reset</button>
  </footer>

main: |
  // main runs in <head>, before the body exists: touch the DOM only in onReady.
  // This page runs on a data: URL, so localStorage and Edrys.setItem are not available,
  // and the whole file must be ASCII: write &hellip; in HTML and \u2026 in JS, not the character itself.

  // State key, prefixed with the module name. The value is the end time in ms
  // (the teacher's clock), or 0 when no countdown runs.
  const END = 'countdown.end'
  const DEFAULT_MINUTES = 5

  function minutes() {
    const c = Edrys.module.teacherConfig
    const m = c && typeof c === 'object' ? Number(c.minutes) : NaN
    return m > 0 ? m : DEFAULT_MINUTES
  }

  function end() {
    return Edrys.getState(END, 'Value') || 0
  }

  function format(ms) {
    const s = Math.ceil(ms / 1000)
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')
  }

  function render() {
    const time = document.getElementById('time')
    const status = document.getElementById('status')
    const hint = document.getElementById('hint')
    time.classList.remove('loading')
    const target = end()
    if (!target) {
      time.textContent = '--:--'
      time.classList.remove('over')
      status.className = 'edrys-pill'
      status.textContent = 'Not started'
      hint.textContent = Edrys.role === 'teacher' ? 'Press Start to begin.' : 'Waiting for the teacher to start.'
      return
    }
    const left = target - Date.now()
    time.textContent = format(Math.max(0, left))
    time.classList.toggle('over', left <= 0)
    status.className = left > 0 ? 'edrys-pill ok' : 'edrys-pill warn'
    status.textContent = left > 0 ? 'Running' : 'Time is up'
    hint.textContent = ''
  }

  Edrys.onReady(() => {
    if (Edrys.role === 'teacher') {
      document.getElementById('controls').hidden = false
      document.getElementById('start').onclick = () =>
        Edrys.getState(END, 'Value', Date.now() + minutes() * 60000)
      document.getElementById('reset').onclick = () => Edrys.getState(END, 'Value', 0)
    }

    // React to changes of our key only, not to every update in the class
    Edrys.getState().observe((event) => {
      if (event.keysChanged.has(END)) render()
    })
    render()
    setInterval(render, 250)
  })
