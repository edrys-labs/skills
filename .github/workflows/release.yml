# Checks the skills on every push and pull request. On a version tag (1.0.0, …) it also
# builds one ZIP per skill, for upload to claude.ai, and publishes them as a GitHub release.
name: Skills

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix skills/edrys-lab/scripts
      - run: node tools/check-skills.mjs

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIPs
        run: |
          mkdir dist
          cd skills
          for skill in */; do
            zip -r "../dist/${skill%/}.zip" "$skill" -x '*/node_modules/*'
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
